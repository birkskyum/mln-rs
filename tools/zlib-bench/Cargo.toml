# Scratch benchmark of mln_util::compression's zlib backends; not a workspace
# member. Pick exactly one backend feature:
#   libz-sys  flate2 on libz-sys (main): the system zlib natively, C zlib on wasm32
#   zlib-rs   flate2 on zlib-rs
#   miniz     flate2 on miniz_oxide
#   libz-ffi  mln_util's direct libz FFI (its Apple backend; links -lz anywhere)
# On wasm32 every build also exports the DecompressionStream path.
[package]
name = "zlib-bench"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zlib-bench"
path = "src/main.rs"

[features]
libz-sys = ["dep:flate2", "flate2/zlib"]
zlib-rs = ["dep:flate2", "flate2/zlib-rs"]
miniz = ["dep:flate2", "flate2/rust_backend"]
libz-ffi = []

[dependencies]
flate2 = { version = "=1.1.11", default-features = false, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "=0.3.107"
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
web-sys = { version = "=0.3.107", features = ["Blob", "ReadableStream", "Response"] }

[profile.release]
debug = false

[workspace]
